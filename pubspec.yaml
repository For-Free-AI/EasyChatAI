name: agnes_chat
description: "仿 DeepSeek 的自定义 API 对话 App，重点适配 Agnes API（OpenAI 兼容）"
publish_to: 'none'
version: 1.6.0+21

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # V1.4.1：中文本地化（文本选择菜单的"全选/复制/粘贴"显示中文）
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  # 网络请求（支持流式 SSE 响应）
  http: ^1.2.0
  # 状态管理
  provider: ^6.1.0
  # 本地存储（保存 API 配置与历史对话）
  shared_preferences: ^2.3.0
  # Markdown 与代码块渲染（DeepSeek 风格回复）
  flutter_markdown: ^0.7.7
  # 代码块自定义渲染需要（flutter_markdown 的底层依赖，显式声明）
  markdown: ^7.3.0
  # v1.5.0：代码块语法高亮
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
